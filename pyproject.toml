[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trial-interim-stopping"
version = "3.0.0"
description = "Group-sequential efficacy boundaries and interim-monitoring utilities for adaptive trials"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
adaptive-trial = "adaptive_trial.cli:main"
adaptive-trial-interim-stopping = "adaptive_trial.cli:main"

[project.urls]
Repository = "https://github.com/abusuraihsakhri/adaptive-trial-interim-stopping"

[tool.setuptools]
py-modules = ["adaptive_boundaries"]

[tool.setuptools.packages.find]
include = ["adaptive_trial*"]
